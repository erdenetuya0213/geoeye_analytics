          type: string
          minLength: 1
        columns:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            minLength: 1
        rows:
          type: array
          minItems: 1
          maxItems: 20000
          items:
            type: array
            minItems: 1
            maxItems: 100
            items:
              type: string
    TabularImportResult:
      type: object
      required: [dataset, importedRows, observationCount, unmatchedHoles, version]
      properties:
        dataset:
          $ref: "#/components/schemas/Dataset"
        importedRows:
          type: integer
          minimum: 0
        observationCount:
          type: integer
          minimum: 0
        unmatchedHoles:
          type: array
          items:
            type: string
        version:
          type: integer
          minimum: 1
    ObservationQuery:
      type: object
      required: [projectId, variableKeys]
      properties:
        projectId:
          type: string
          format: uuid
        variableKeys:
          type: array
          minItems: 1
          items:
            type: string
        datasetIds:
          type: array
          items:
            type: string
            format: uuid
        holeIds:
          type: array
          items:
            type: string
            format: uuid
        depthFrom:
          type: number
          minimum: 0
        depthTo:
          type: number
          minimum: 0
        acceptedOnly:
          type: boolean
          default: true
        limit:
          type: integer
          minimum: 1
          maximum: 200000
          default: 50000
          description: Page size. Request further pages with offset until a page is shorter than limit.
        offset:
          type: integer
          minimum: 0
          default: 0
    ObservationValue:
      type: object
      required: [id, projectId, datasetId, sourceType, sourceId, variableKey, quality]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        datasetId:
          type: string
          format: uuid
        datasetVersionId:
          type: [string, "null"]
          format: uuid
        sourceType:
          type: string
        sourceId:
          type: string
        holeId:
          type: [string, "null"]
          format: uuid
        depthFrom:
          type: [number, "null"]
        depthTo:
          type: [number, "null"]
        variableKey:
          type: string
        numericValue:
          type: [number, "null"]
        textValue:
          type: [string, "null"]
        categoryValue:
          type: [string, "null"]
        booleanValue:
          type: [boolean, "null"]
        datetimeValue:
          type: [string, "null"]
          format: date-time
        unit:
          type: [string, "null"]
        quality:
          type: string
          enum: [raw, reviewed, accepted, flagged]
        observedAt:
          type: [string, "null"]
          format: date-time
    CreateAnalysisRun:
      type: object
      required: [projectId, analysisType, algorithmVersion, datasetSnapshot, parameters]
      properties:
        projectId:
          type: string
          format: uuid
        analysisType:
          type: string
        algorithmVersion:
          type: string
        datasetSnapshot:
          type: object
          additionalProperties: true
        parameters:
          type: object
          additionalProperties: true
    AnalysisRun:
      allOf:
        - $ref: "#/components/schemas/CreateAnalysisRun"
        - type: object
          required: [id, createdBy, createdAt, status]
          properties:
            id:
              type: string
              format: uuid
            createdBy:
              type: [string, "null"]
              format: uuid
            createdAt:
              type: string
              format: date-time
            status:
              type: string
              enum: [draft, running, saved, accepted, failed, cancelled, superseded]
    DerivedValueInput:
      type: object
      required: [variableKey, sourceEntityType, sourceEntityId, inputObservationIds]
      properties:
        variableKey:
          type: string
        sourceEntityType:
          type: string
        sourceEntityId:
          type: string
        holeId:
          type: [string, "null"]
          format: uuid
        depthFrom:
          type: [number, "null"]
        depthTo:
          type: [number, "null"]
        numericValue:
          type: [number, "null"]
        textValue:
          type: [string, "null"]
        categoryValue:
          type: [string, "null"]
        confidence:
          type: [number, "null"]
          minimum: 0
          maximum: 1
        status:
          type: string
          enum: [draft, saved, accepted, superseded]
          default: draft
        inputObservationIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
    AnalysisResultArtifactInput:
      type: object
